bundle:
  name: talend_modernized_warehouse

include:
  - resources/jobs/*.yml

targets:
  dev:
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: "vente_catalog_dev"

  staging:
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: "vente_catalog_stage"

  prod:
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: "vente_catalog"
    run_as:
      service_principal_name: "sp-data-warehouse-etl"
